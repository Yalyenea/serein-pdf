name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        run: swift test

      - name: Build .app
        run: ./Scripts/make-app.sh build

      - name: Package DMG
        run: ./Scripts/make-dmg.sh build

      - name: Resolve version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Serein.app/Contents/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=build/Serein-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: |
          mkdir -p .tmp
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '
            /^## \[/ {
              if (capture) {
                exit
              }
              if ($0 ~ ("^## \\[" version "\\]")) {
                capture = 1
              }
            }
            capture {
              print
            }
          ' CHANGELOG.md > .tmp/release-notes.md

          if [ ! -s .tmp/release-notes.md ]; then
            echo "Failed to find changelog entry for $VERSION" >&2
            exit 1
          fi

          cat >> .tmp/release-notes.md <<'EOF'

          Install:
          1. Download the DMG artifact attached to this release
          2. Open it and drag `Serein.app` to `/Applications`
          3. First launch: right-click -> Open, or run `xattr -dr com.apple.quarantine /Applications/Serein.app`
          EOF

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: Serein-${{ steps.version.outputs.version }}-dmg
          path: ${{ steps.version.outputs.dmg }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Serein ${{ github.ref_name }}
          files: ${{ steps.version.outputs.dmg }}
          body_path: .tmp/release-notes.md
          draft: false
          prerelease: false
