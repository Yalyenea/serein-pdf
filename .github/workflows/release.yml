name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub's macOS 27 ARM64 image is published under the xcode-27 label.
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Show tool versions
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          swift --version
          xcodebuild -version

      - name: Test
        run: swift test --no-parallel

      - name: Build .app
        env:
          SEREIN_CODESIGN_IDENTITY: "-"
        run: ./Scripts/make-app.sh build

      - name: Package DMG
        run: ./Scripts/make-dmg.sh build

      - name: Resolve version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Serein.app/Contents/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=build/Serein-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: |
          mkdir -p .tmp
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '
            /^## \[/ {
              if (capture) {
                exit
              }
              if ($0 ~ ("^## \\[" version "\\]")) {
                capture = 1
              }
            }
            capture {
              print
            }
          ' CHANGELOG.md > .tmp/release-notes.md

          if [ ! -s .tmp/release-notes.md ]; then
            echo "Failed to find changelog entry for $VERSION" >&2
            exit 1
          fi

          cat >> .tmp/release-notes.md <<'EOF'

          Install (Apple silicon, macOS 14 or later):
          1. Download the DMG attached to this release
          2. Open it and drag `Serein.app` to `/Applications`
          3. This build is not notarized. If macOS blocks the first launch, follow [Apple’s instructions](https://support.apple.com/en-us/102445) to open a trusted app through System Settings → Privacy & Security → Open Anyway.

          Serein is licensed under GPL-3.0-only. The matching source is available in the source archives below.
          EOF

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: Serein-${{ steps.version.outputs.version }}-dmg
          path: ${{ steps.version.outputs.dmg }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Serein ${{ github.ref_name }}
          files: ${{ steps.version.outputs.dmg }}
          body_path: .tmp/release-notes.md
          draft: false
          prerelease: false
