name: Website checks

on:
  push:
    branches: [main]
    paths: ["Website/**", "Scripts/check-website.py", "Justfile", "wrangler.website.jsonc", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["Website/**", "Scripts/check-website.py", "Justfile", "wrangler.website.jsonc", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
      - run: just website-check
